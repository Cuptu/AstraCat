name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit repository contents
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\audit-repository.ps1

      - name: Restore locked dependencies
        run: dotnet restore AstraCat.csproj --locked-mode

      - name: Build
        run: dotnet build AstraCat.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Check Python worker syntax
        run: python -m py_compile engines/asr_worker.py
